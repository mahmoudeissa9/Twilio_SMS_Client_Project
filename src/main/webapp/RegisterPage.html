<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twilio SMS Portal | Secure Registration</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS VARIABLES (COLOR PALETTE & SPACING) --- */
        :root {
            --primary-color: #001f3f; /* Deep Navy for reliability */
            --accent-color: #007bff;   /* Bright Blue for actions */
            --accent-hover: #0056b3;
            --success-color: #28a745;

            --bg-body: #f4f7f6;        /* Subtle gray/blue bg */
            --bg-card: #ffffff;
            
            --text-dark: #1a1a1a;
            --text-muted: #6c757d;
            --border-color: #e0e0e0;
            
            --radius-md: 10px;
            --shadow-card: 0 15px 35px rgba(0,0,0,0.1);
        }

        /* --- GLOBAL RESETS --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-dark);
            line-height: 1.5;
            
            /* Fill the entire screen and center the card */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px; /* Padding for mobile */
        }

        /* --- THE MAIN CARD CONTROLLER --- */
        .registration-card {
            background-color: var(--bg-card);
            width: 100%;
            max-width: 800px; /* Optimal reading width for complex forms */
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-card);
            overflow: hidden; /* Keeps contents inside the rounded corners */
            animation: fadeIn 0.5s ease-in; /* Smooth entrance */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- CARD HEADER (Welcome Area) --- */
        .card-header {
            background-color: var(--primary-color);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .card-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .card-header p {
            color: #b0c4de; /* Softened blue-gray text */
            font-size: 1rem;
            max-width: 500px;
            margin: 0 auto;
        }

        /* --- FORM CONTENT AREA --- */
        .card-body {
            padding: 50px;
        }

        .form-section-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
        }

        /* --- FORM GRID SETUP --- */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 columns by default */
            gap: 25px; /* Spacious gaps between fields */
            margin-bottom: 40px;
        }

        /* Special class for full-width inputs */
        .full-width {
            grid-column: span 2;
        }

        /* --- INPUT STYLING (The core UI/UX) --- */
        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        /* Modern, subtle input boxes */
        .input-group input, 
        .input-group select {
            padding: 12px 15px;
            font-size: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            transition: all 0.2s ease;
            color: var(--text-dark);
        }

        /* UX: Change background and border on focus for clear feedback */
        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: var(--accent-color);
            background-color: #f0f8ff; /* AliceBlue background on focus */
            box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.1);
        }

        /* Placeholder color */
        .input-group input::placeholder {
            color: #adb5bd;
        }

        /* --- BUTTONS --- */
        .action-area {
            text-align: center;
            margin-top: 20px;
        }

        .btn-register {
            background-color: var(--accent-color);
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 15px 40px;
            border: none;
            border-radius: 30px; /* Pillow button for modern feel */
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 6px rgba(0, 123, 255, 0.2);
        }

        .btn-register:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-register:active {
            transform: translateY(1px);
        }

        /* --- FOOTER (Login Link) --- */
        .card-footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .card-footer a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }

        .card-footer a:hover {
            text-decoration: underline;
        }

        /* --- RESPONSIVE DESIGN (Crucial UX) --- */
        /* For screens smaller than 768px (tablets/phones) */
        @media (max-width: 768px) {
            .card-header {
                padding: 30px 20px;
            }

            .card-body {
                padding: 30px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr; /* Switch to 1 column */
                gap: 20px;
            }

            .full-width {
                grid-column: span 1; /* Inputs remain 1 column wide */
            }

            .card-header h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="registration-card">
        <div class="card-header">
            <h1>Create Your Account</h1>
            <p>Join the secure SMS gateway. Manage communications globally using your Twilio credentials.</p>
        </div>

        <div class="card-body">
            <form action="RegisterServlet" method="POST" id="regForm">
                
                <h2 class="form-section-title">Personal Profile</h2>
                <div class="form-grid">
                    <div class="input-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" placeholder="Mahmoud Ali" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="birthday">Birthday</label>
                        <input type="date" id="birthday" name="birthday" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="mahmoud@example.com" required>
                    </div>

                    <div class="input-group">
                        <label for="phone">Phone (MSISDN)</label>
                        <input type="tel" id="phone" name="phone" placeholder="+201..." required>
                    </div>

                    <div class="input-group">
                        <label for="job">Job Title</label>
                        <input type="text" id="job" name="job" placeholder="Software Engineer">
                    </div>
                    
                    <div class="input-group full-width">
                        <label for="address">Address</label>
                        <input type="text" id="address" name="address" placeholder="123 Nile St, Cairo, Egypt">
                    </div>

                    <div class="input-group full-width">
                        <label for="password">Account Password</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <h2 class="form-section-title">Twilio API Settings</h2>
                <div class="form-grid">
                    <div class="input-group full-width">
                        <label for="twilio_sid">Account SID</label>
                        <input type="text" id="twilio_sid" name="twilio_sid" placeholder="ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" required>
                    </div>

                    <div class="input-group">
                        <label for="twilio_token">Auth Token</label>
                        <input type="password" id="twilio_token" name="twilio_token" placeholder="Your Twilio Token" required>
                    </div>

                    <div class="input-group">
                        <label for="sender_id">Twilio Allowed Sender ID</label>
                        <input type="text" id="sender_id" name="sender_id" placeholder="e.g., MyCompany" required>
                    </div>
                </div>

                <div class="action-area">
                    <button type="submit" class="btn-register">Register Account</button>
                </div>
                
                <div class="card-footer">
                    Already registered? <a href="login.html">Sign In Here</a>
                </div>

            </form>
        </div>
    </div>

</body>
</html>
